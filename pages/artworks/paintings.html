<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paintings — The Gustav Metzger Foundation</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="site-wrapper">

    <!-- Header -->
    <header class="site-header">
      <a href="../../index.html">The Gustav Metzger Foundation</a>
      <div class="menu-toggle">Menu</div>
    </header>

    <!-- Full-Screen Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay">
      <div class="menu-header">
        <a href="../../index.html">The Gustav Metzger Foundation</a>
        <div class="menu-close" id="menuClose">Close</div>
      </div>
      <div class="menu-panel" id="menuMain">
        <a class="menu-item" href="../about.html">Gustav Metzger</a>
        <a class="menu-item" href="../artworks.html">Artworks</a>
        <a class="menu-item" href="../publications.html">Publications</a>
        <a class="menu-item" href="../texts.html">Texts</a>
        <a class="menu-item" href="../exhibitions.html">Exhibitions</a>
        <a class="menu-item" id="foundationToggle"><span class="the-prefix">The </span>Foundation <img class="foundation-arrow" src="../../images/back-arrow.svg" alt=""></a>
      </div>
      <div class="menu-panel hidden" id="menuFoundation">
        <a class="menu-back" id="menuBack"><img src="../../images/back-arrow.svg" alt="">Back</a>
        <a class="menu-item" href="../foundation.html">Info</a>
        <a class="menu-item" href="../news.html">News</a>
        <a class="menu-item" href="../people.html">People</a>
        <a class="menu-item" href="../contact.html">Contact</a>
      </div>
    </div>

    <!-- Content -->
    <main class="content">
      <div class="page-title">Paintings</div>

      <!-- Sub-nav -->
      <div class="artwork-subnav">
        <a class="me-4 pointer" id="btnAll"><h2 class="d-inline-block mb-2">All</h2></a>
        <a class="me-4 pointer" id="btnFilter"><h2 class="d-inline-block mb-2">Filter <img class="filter-arrow" id="filterArrow" src="../../images/back-arrow-black.svg" alt=""></h2></a>
      </div>

      <!-- Filter Panel -->
      <div class="filter-panel" id="filterPanel">
        <div class="filter-group">
          <div class="filter-group-title">Subjects</div>
          <div id="filterSubjects"></div>
        </div>
        <div class="filter-group">
          <div class="filter-group-title">Materials</div>
          <div id="filterMaterials"></div>
        </div>
        <div class="filter-group">
          <div class="filter-group-title">Decades</div>
          <div id="filterDecades"></div>
        </div>
      </div>

      <hr class="mb-0">

      <!-- No artworks in this category -->

    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <a href="http://eepurl.com/jb20Do" target="_blank" rel="noopener">Newsletter</a>
      <div>&copy; 2025</div>
    </footer>

  </div>

  <script>
    // Menu
    const menuToggle = document.querySelector('.menu-toggle');
    const menuOverlay = document.getElementById('menuOverlay');
    const menuClose = document.getElementById('menuClose');
    const menuMain = document.getElementById('menuMain');
    const menuFoundation = document.getElementById('menuFoundation');
    const foundationToggle = document.getElementById('foundationToggle');
    const menuBack = document.getElementById('menuBack');
    function openMenu() {
      menuOverlay.classList.add('open');
      menuMain.classList.remove('hidden');
      menuFoundation.classList.add('hidden');
    }
    function closeMenu() {
      menuOverlay.classList.remove('open');
    }
    menuToggle.addEventListener('click', openMenu);
    menuClose.addEventListener('click', closeMenu);
    foundationToggle.addEventListener('click', () => {
      menuMain.classList.add('hidden');
      menuFoundation.classList.remove('hidden');
    });
    menuBack.addEventListener('click', () => {
      menuFoundation.classList.add('hidden');
      menuMain.classList.remove('hidden');
    });

    // Filter (empty - no artworks, but UI present)
    const btnFilter = document.getElementById('btnFilter');
    const filterArrow = document.getElementById('filterArrow');
    const filterPanel = document.getElementById('filterPanel');

    btnFilter.addEventListener('click', () => {
      filterPanel.classList.toggle('open');
      filterArrow.classList.toggle('open');
    });

    document.getElementById('btnAll').addEventListener('click', () => {
      filterPanel.classList.remove('open');
      filterArrow.classList.remove('open');
    });
  </script>
</body>
</html>
