<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Gustav Metzger Foundation</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>
<body>
  <div class="site-wrapper no-scroll">

    <!-- Header -->
    <header class="site-header header-light">
      <a href="index.html">The Gustav Metzger Foundation</a>
      <div class="menu-toggle">Menu</div>
    </header>

    <!-- Full-Screen Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay">
      <div class="menu-header">
        <a href="index.html">The Gustav Metzger Foundation</a>
        <div class="menu-close" id="menuClose">Close</div>
      </div>
      <!-- Main menu panel -->
      <div class="menu-panel" id="menuMain">
        <a class="menu-item" href="pages/about.html">Gustav Metzger</a>
        <a class="menu-item" href="pages/artworks.html">Artworks</a>
        <a class="menu-item" href="pages/publications.html">Publications</a>
        <a class="menu-item" href="pages/texts.html">Texts</a>
        <a class="menu-item" href="pages/exhibitions.html">Exhibitions</a>
        <a class="menu-item" id="foundationToggle"><span class="the-prefix">The </span>Foundation <img class="foundation-arrow" src="images/back-arrow.svg" alt=""></a>
      </div>
      <!-- Foundation sub-panel -->
      <div class="menu-panel hidden" id="menuFoundation">
        <a class="menu-back" id="menuBack"><img src="images/back-arrow.svg" alt="">Back</a>
        <a class="menu-item" href="pages/foundation.html">Info</a>
        <a class="menu-item" href="pages/news.html">News</a>
        <a class="menu-item" href="pages/people.html">People</a>
        <a class="menu-item" href="pages/contact.html">Contact</a>
      </div>
    </div>

    <!-- Homepage Slider -->
    <div class="homepage-slider">
      <div class="swiper homepage-swiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide" style="background-image: url('images/t12156_10.jpg')"></div>
          <div class="swiper-slide" style="background-image: url('images/slider-bynder.jpg')"></div>
          <div class="swiper-slide" style="background-image: url('images/slider-artnews.jpg')"></div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer footer-dark">
      <a href="http://eepurl.com/jb20Do" target="_blank" rel="noopener">Newsletter</a>
      <div>&copy; 2025</div>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    // Menu
    const menuToggle = document.querySelector('.menu-toggle');
    const menuOverlay = document.getElementById('menuOverlay');
    const menuClose = document.getElementById('menuClose');
    const menuMain = document.getElementById('menuMain');
    const menuFoundation = document.getElementById('menuFoundation');
    const foundationToggle = document.getElementById('foundationToggle');
    const menuBack = document.getElementById('menuBack');

    function openMenu() {
      menuOverlay.classList.add('open');
      menuMain.classList.remove('hidden');
      menuFoundation.classList.add('hidden');
    }
    function closeMenu() {
      menuOverlay.classList.remove('open');
    }

    menuToggle.addEventListener('click', openMenu);
    menuClose.addEventListener('click', closeMenu);

    foundationToggle.addEventListener('click', () => {
      menuMain.classList.add('hidden');
      menuFoundation.classList.remove('hidden');
    });
    menuBack.addEventListener('click', () => {
      menuFoundation.classList.add('hidden');
      menuMain.classList.remove('hidden');
    });

    // Swiper
    new Swiper('.homepage-swiper', {
      loop: true,
      autoplay: {
        delay: 6000,
        disableOnInteraction: false,
      },
      effect: 'fade',
      fadeEffect: {
        crossFade: true,
      },
      speed: 1000,
    });
  </script>
</body>
</html>
